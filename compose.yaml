services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Configure a reachable gateway and mount its private token before enabling.
      # Host loopback services are not reachable through container loopback.
      CODEX_GATEWAY_URL: ${CODEX_GATEWAY_URL:-}
      CODEX_GATEWAY_TOKEN_FILE: ${CODEX_GATEWAY_TOKEN_FILE:-}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-6.1-sol}
    volumes:
      - agent-data:/data
volumes:
  agent-data:
