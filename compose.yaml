services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      STUN_URLS: ${STUN_URLS-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - agent-data:/data
volumes:
  agent-data:
