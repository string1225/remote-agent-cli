# This vhost is independent of the existing home.sunny-string.cn site.
# Install only after the matching certificate has been issued.
log_format remote_agent '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name codex.sunny-string.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/sunny-string.cn/html;
        try_files $uri =404;
    }
    location / { return 301 https://codex.sunny-string.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codex.sunny-string.cn;
    ssl_certificate /etc/letsencrypt/live/codex.sunny-string.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codex.sunny-string.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:remote_agent_ssl:10m;
    ssl_session_timeout 1d;
    access_log /var/log/nginx/remote-agent.access.log remote_agent;
    error_log /var/log/nginx/remote-agent.error.log;
    client_max_body_size 128k;

    location = / { return 302 /agents/; }
    location = /agents { return 308 /agents/; }
    location ^~ /agents/ {
        # Preserve the prefix: the Go application mounts itself at /agents.
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location / { return 404; }
}
