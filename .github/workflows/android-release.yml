name: Android APK Release
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/android-release.yml'
      - 'tools/android/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Restore durable release signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo 'Configure the four ANDROID signing secrets; unsigned APKs cannot update existing installations.'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          chmod 600 "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((10000 + ${{ github.run_number }} * 100 + ${{ github.run_attempt }}))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.${{ github.run_number }}.${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease assembleRelease
      - name: Verify APK and generate update manifest
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          node tools/android/release-manifest.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: remote-agent-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/reports/lint-results-release.html
            dist/android/*
      - name: Publish versioned APK and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v$ANDROID_VERSION_NAME"
          gh release create "$tag" dist/android/remote-agent.apk dist/android/android-update.json dist/android/remote-agent.apk.sha256 --target "$GITHUB_SHA" --title "Android $ANDROID_VERSION_NAME" --notes "Android workbench, projects and todos. Commit: $GITHUB_SHA" --latest=false
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --target "$GITHUB_SHA" --title 'Android update channel' --notes 'Stable download links for the Android updater. Versioned APKs are retained in Android releases.' --prerelease --latest=false
          fi
          mkdir -p "$RUNNER_TEMP/android-existing"
          if gh release download android-latest --pattern android-update.json --dir "$RUNNER_TEMP/android-existing"; then
            if node -e 'const old=require(process.argv[1]);process.exit(old.versionCode >= Number(process.env.ANDROID_VERSION_CODE) ? 0 : 1)' "$RUNNER_TEMP/android-existing/android-update.json"; then
              echo 'A newer update channel already exists; keeping the versioned release without replacing it.'
              exit 0
            fi
          fi
          gh release upload android-latest dist/android/android-update.json dist/android/remote-agent.apk dist/android/remote-agent.apk.sha256 --clobber
          gh release edit android-latest --notes "Android $ANDROID_VERSION_NAME. Commit: $GITHUB_SHA. Versioned APKs are retained in Android releases."
