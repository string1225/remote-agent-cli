name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sayso-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sayso-ui/package-lock.json
      - run: npm ci
        working-directory: sayso-ui
      - run: npm run build
        working-directory: sayso-ui
      - run: git diff --exit-code -- web/sayso
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - run: node --check web/platform.js
      - run: node --check web/channels.js
      - if: runner.os == 'Linux'
        run: go test -race ./...
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/build
      - run: go build -trimpath -o bin/remote-server ./cmd/server
      - run: go build -trimpath -o bin/personal-gateway ./cmd/personal-gateway
      - uses: actions/upload-artifact@v4
        with:
          name: remote-agent-binaries
          path: |
            dist/
            bin/
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .local/wix314
          key: wix-3.14.1-6ac824e1
      - name: MSI and Windows Service lifecycle acceptance
        shell: pwsh
        run: ./tools/msi/acceptance.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msi-acceptance-logs
          path: .local/msi-acceptance/*.log
      - name: Build distributable x64 and ARM64 installers
        shell: pwsh
        run: ./tools/msi/build.ps1 -PackageVersion "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: remote-agent-windows-msi
          path: |
            dist/*.msi
            dist/*.msi.sha256
