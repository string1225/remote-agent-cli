name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sayso-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sayso-ui/package-lock.json
      - run: npm ci
        working-directory: sayso-ui
      - run: npm run build
        working-directory: sayso-ui
      - run: git diff --exit-code -- web/sayso
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - if: runner.os == 'Linux'
        run: go test -race ./...
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/build
      - run: go build -trimpath -o bin/remote-server ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: remote-agent-binaries
          path: |
            dist/
            bin/
