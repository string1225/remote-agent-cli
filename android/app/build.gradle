plugins { id 'com.android.application' }

android {
    namespace 'cn.sunnystring.remoteagent'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.sunnystring.remoteagent'
        minSdk 26
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('ANDROID_VERSION_NAME') ?: '0.1-dev'
        buildConfigField 'String', 'UPDATE_URL', '"https://gh-proxy.com/https://github.com/string1225/remote-agent-cli/releases/download/android-latest/android-update.json"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
